<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMERA — Mental Math</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
 
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --panel-2:#171b23;
    --line:#232833;
    --line-soft:#1a1e26;
    --text:#f5f7fa;
    --muted:#838ba0;
    --muted-2:#565e6e;
    --accent:#8cff66;
    --accent-2:#c8ffb0;
    --accent-dim:rgba(140,255,102,.12);
    --danger:#ff5f6d;
    --warning:#ffc857;
    --shadow:0 24px 70px rgba(0,0,0,.45);
    --ease:cubic-bezier(.16,.84,.44,1);
  }
 
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
  body{
    font-family:"DM Sans",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
 
  body:before{
    content:"";
    position:fixed;
    width:560px;height:560px;
    border-radius:50%;
    background:rgba(140,255,102,.05);
    filter:blur(100px);
    top:-280px;right:-200px;
    pointer-events:none;
  }
  body:after{
    content:"";
    position:fixed;
    width:420px;height:420px;
    border-radius:50%;
    background:rgba(140,255,102,.025);
    filter:blur(90px);
    bottom:-220px;left:-160px;
    pointer-events:none;
  }
 
  .app{
    width:min(920px,100%);
    min-height:650px;
    background:
      linear-gradient(150deg,rgba(140,255,102,.02),transparent 40%),
      linear-gradient(145deg,#12151c,#0d0f14);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
 
  /* signature: faint graph-paper grid, on-theme for a mental-math tool */
  .app:before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(140,255,102,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(140,255,102,.05) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 0%,transparent 72%);
            mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 0%,transparent 72%);
    pointer-events:none;
    z-index:0;
  }
  .topbar,.screen{position:relative;z-index:1}
 
  .topbar{
    height:76px;
    padding:0 28px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
 
  .brand{
    display:flex;align-items:center;gap:11px;
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;letter-spacing:.08em;
    font-size:16px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;
    background:var(--accent);
    color:#0e120a;font-weight:800;
    font-family:"JetBrains Mono",monospace;
    transform:rotate(-7deg);
  }
 
  .status{
    display:flex;align-items:center;gap:8px;
    color:var(--muted);font-size:12px;
    font-family:"JetBrains Mono",monospace;
    letter-spacing:.04em;
  }
  .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
 
  .screen{padding:34px}
  .hidden{display:none!important}
 
  .hero{
    min-height:535px;
    display:grid;
    place-items:center;
    text-align:center;
  }
 
  .hero-inner{max-width:680px}
  .eyebrow{
    color:var(--accent);
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.2em;
    font-weight:800;
    margin-bottom:16px;
    font-family:"JetBrains Mono",monospace;
  }
 h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(42px,7vw,76px);
    line-height:.94;
    letter-spacing:-.055em;
    margin:0 0 18px;
  }
  .hero p{
    color:var(--muted);font-size:16px;line-height:1.65;
    max-width:530px;margin:0 auto 30px;
  }
 
  .modes{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin-bottom:22px;
  }
  .mode{
    border:1px solid var(--line);
    background:#151922;color:#aeb5c2;
    padding:11px 17px;border-radius:12px;
    cursor:pointer;font:600 13px inherit;
    transition:.18s var(--ease);
    display:flex;align-items:center;gap:8px;
  }
  .mode .key{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;color:var(--muted-2);
    border:1px solid var(--line);border-radius:4px;
    width:16px;height:16px;display:grid;place-items:center;
  }
  .mode:hover{border-color:#3a424f;color:#fff}
  .mode.active{
    background:var(--accent);color:#11170e;
    border-color:var(--accent);
  }
  .mode.active .key{border-color:rgba(17,23,14,.3);color:#11170e}
 
  button{
    border:0;font:700 14px inherit;cursor:pointer;
    font-family:"DM Sans",sans-serif;
  }
  button:focus-visible,.mode:focus-visible,.answer:focus-visible{
    outline:2px solid var(--accent);outline-offset:3px;
  }
  .primary{
    min-width:190px;padding:15px 24px;border-radius:13px;
    background:var(--accent);color:#0f140b;
    box-shadow:0 10px 30px rgba(140,255,102,.14);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  .primary:hover{transform:translateY(-2px);box-shadow:0 14px 35px rgba(140,255,102,.2)}
  .primary:active{transform:translateY(0)}
 
  .hint{
    margin-top:20px;color:#5b6373;font-size:12px;
    font-family:"JetBrains Mono",monospace;
    letter-spacing:.02em;
  }
 
  .game-head{
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:center;gap:20px;margin-bottom:30px;
  }
  .metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}
  .metric-value{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .right{text-align:right}
 
  .timer-wrap{
    width:76px;height:76px;border-radius:50%;
    display:grid;place-items:center;
    background:conic-gradient(var(--accent) var(--progress,100%),#242a33 0);
    position:relative;
    transition:background .3s linear;
  }
  .timer-wrap:before{
    content:"";position:absolute;inset:6px;background:var(--panel);border-radius:50%;
  }
  .timer{position:relative;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .timer-wrap.danger{background:conic-gradient(var(--danger) var(--progress,100%),#242a33 0)}
  .timer-wrap.danger .timer{color:var(--danger)}
