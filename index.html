<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMERA — Mental Math</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
 
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --panel-2:#171b23;
    --line:#232833;
    --line-soft:#1a1e26;
    --text:#f5f7fa;
    --muted:#838ba0;
    --muted-2:#565e6e;
    --accent:#8cff66;
    --accent-2:#c8ffb0;
    --accent-dim:rgba(140,255,102,.12);
    --danger:#ff5f6d;
    --warning:#ffc857;
    --shadow:0 24px 70px rgba(0,0,0,.45);
    --ease:cubic-bezier(.16,.84,.44,1);
  }
 
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
  body{
    font-family:"DM Sans",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
 
  body:before{
    content:"";
    position:fixed;
    width:560px;height:560px;
    border-radius:50%;
    background:rgba(140,255,102,.05);
    filter:blur(100px);
    top:-280px;right:-200px;
    pointer-events:none;
  }
  body:after{
    content:"";
    position:fixed;
    width:420px;height:420px;
    border-radius:50%;
    background:rgba(140,255,102,.025);
    filter:blur(90px);
    bottom:-220px;left:-160px;
    pointer-events:none;
  }
 
  .app{
    width:min(920px,100%);
    min-height:650px;
    background:
      linear-gradient(150deg,rgba(140,255,102,.02),transparent 40%),
      linear-gradient(145deg,#12151c,#0d0f14);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
 
  /* signature: faint graph-paper grid, on-theme for a mental-math tool */
  .app:before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(140,255,102,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(140,255,102,.05) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 0%,transparent 72%);
            mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 0%,transparent 72%);
    pointer-events:none;
    z-index:0;
  }
  .topbar,.screen{position:relative;z-index:1}
 
  .topbar{
    height:76px;
    padding:0 28px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
 
  .brand{
    display:flex;align-items:center;gap:11px;
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;letter-spacing:.08em;
    font-size:16px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;
    background:var(--accent);
    color:#0e120a;font-weight:800;
    font-family:"JetBrains Mono",monospace;
    transform:rotate(-7deg);
  }
 
  .status{
    display:flex;align-items:center;gap:8px;
    color:var(--muted);font-size:12px;
    font-family:"JetBrains Mono",monospace;
    letter-spacing:.04em;
  }
  .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
 
  .screen{padding:34px}
  .hidden{display:none!important}
 
  .hero{
    min-height:535px;
    display:grid;
    place-items:center;
    text-align:center;
  }
 
  .hero-inner{max-width:680px}
  .eyebrow{
    color:var(--accent);
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.2em;
    font-weight:800;
    margin-bottom:16px;
    font-family:"JetBrains Mono",monospace;
  }
